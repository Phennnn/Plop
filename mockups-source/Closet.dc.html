<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plop's closet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
body { margin: 0; font-family: "Pixelify Sans", "Trebuchet MS", sans-serif; }
a { color: #7A4A21; } a:hover { color: #5A3415; }
</style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background-color: #EFE3D2; background-image: linear-gradient(45deg, #E7D6BF 25%, transparent 25%, transparent 75%, #E7D6BF 75%), linear-gradient(45deg, #E7D6BF 25%, transparent 25%, transparent 75%, #E7D6BF 75%); background-size: 32px 32px; background-position: 0 0, 16px 16px; color: #2B1A10; display: flex; flex-direction: column; padding: 52px 20px 0; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Today.dc.html" aria-label="Back to today" style="width: 40px; height: 40px; display: grid; place-items: center; color: #2B1A10; text-decoration: none; border: 3px solid #2B1A10; background: #FFF8EC; box-sizing: border-box">
        <svg width="14" height="14" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true" fill="currentColor"><rect x="3" y="0" width="1" height="1"></rect><rect x="2" y="1" width="1" height="1"></rect><rect x="1" y="2" width="1" height="1"></rect><rect x="0" y="3" width="7" height="1"></rect><rect x="1" y="4" width="1" height="1"></rect><rect x="2" y="5" width="1" height="1"></rect><rect x="3" y="6" width="1" height="1"></rect></svg>
      </a>
      <h1 style="margin: 0; font-family: 'Press Start 2P', monospace; font-size: 17px">CLOSET</h1>
    </div>
    <span style="display: inline-flex; align-items: center; gap: 8px; background: #E0A32E; border: 3px solid #2B1A10; box-shadow: 4px 4px 0 #2B1A10; padding: 8px 11px; font-family: 'Press Start 2P', monospace; font-size: 12px" aria-label="{{ptsLabel}}">
      <svg width="14" height="14" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="0" width="3" height="7" fill="#FFF8EC"></rect><rect x="0" y="2" width="7" height="3" fill="#FFF8EC"></rect><rect x="1" y="1" width="5" height="5" fill="#FFF8EC"></rect><rect x="3" y="2" width="1" height="3" fill="#B07A18"></rect></svg>
      {{pts}}
    </span>
  </div>

  <div style="margin-top: 14px; border: 3px solid #2B1A10; box-shadow: 5px 5px 0 #2B1A10; line-height: 0">
    <dc-import name="Buddy" w="344" h="200" px="5" embed="yes" hat="{{phat}}" skin="{{pskin}}" face="{{pface}}" mood="{{pmood}}" bubble="{{bub}}" hint-size="344px,200px"></dc-import>
  </div>

  <div style="margin-top: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px" role="tablist" aria-label="Item type">
    <button type="button" role="tab" aria-selected="{{tabHatsOn}}" onClick="{{tabHats}}" style="height: 44px; border: 3px solid #2B1A10; cursor: pointer; font-family: 'Press Start 2P', monospace; font-size: 10px; padding: 0; {{tabHatsStyle}}">HATS</button>
    <button type="button" role="tab" aria-selected="{{tabSkinsOn}}" onClick="{{tabSkins}}" style="height: 44px; border: 3px solid #2B1A10; cursor: pointer; font-family: 'Press Start 2P', monospace; font-size: 10px; padding: 0; {{tabSkinsStyle}}">SKINS</button>
    <button type="button" role="tab" aria-selected="{{tabFaceOn}}" onClick="{{tabFace}}" style="height: 44px; border: 3px solid #2B1A10; cursor: pointer; font-family: 'Press Start 2P', monospace; font-size: 10px; padding: 0; {{tabFaceStyle}}">FACE</button>
  </div>

  <div style="margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
      <button type="button" onClick="{{it.pick}}" aria-label="{{it.label}}" style="height: 104px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border: 3px solid #2B1A10; cursor: pointer; padding: 6px 4px; color: #2B1A10; {{it.card}}">
        <span style="display: grid; grid-template-columns: repeat(8, 5px); grid-auto-rows: 5px" aria-hidden="true">
          <sc-for list="{{it.cells}}" as="c" hint-placeholder-count="48"><span style="width: 5px; height: 5px; {{c.s}}"></span></sc-for>
        </span>
        <span style="font-family: 'Press Start 2P', monospace; font-size: 7px; line-height: 1.4">{{it.name}}</span>
        <span style="font-family: 'Pixelify Sans', sans-serif; font-size: 14px; font-weight: 600; {{it.tagStyle}}">{{it.tag}}</span>
      </button>
    </sc-for>
  </div>

  <button type="button" onClick="{{act}}" style="margin-top: 16px; height: 58px; border: 3px solid #2B1A10; cursor: pointer; font-family: 'Press Start 2P', monospace; font-size: 12px; padding: 0; {{actStyle}}">{{actLabel}}</button>

  <p style="margin: 14px 0 0; font-size: 15px; line-height: 1.4; color: #6E5542">Every log earns 10. Type 3–4 adds 15, a note adds 5. You never lose points.</p>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const PAL = { k: '#2B1A10', w: '#FFF8EC', g: '#E0A32E', G: '#B07A18', t: '#2E7D72', T: '#1F5C54', p: '#E5576B', P: '#B83A4F', r: '#D9553B', R: '#A63F2A', c: '#6FB7D9', x: '#C9B79C' };
    const NONE = ['........', '.x....x.', '..x..x..', '...xx...', '..x..x..', '.x....x.'];
    const POOP = ['...bb...', '..blbb..', '.bbbbbb.', '.lbbbbd.', 'bbbbbbbd', '.dddddd.'];
    const SKIN = {
      classic: ['#7A4A21', '#A9713A', '#5A3415'], roast: ['#4A2A14', '#6B4226', '#2F1A0C'],
      caramel: ['#B87333', '#D89A5B', '#8A5424'], strawberry: ['#D9788A', '#F2AEBB', '#A9566A'],
      mint: ['#5FB096', '#9AD8C2', '#3F8670'], gold: ['#E0A32E', '#F5CC79', '#B07A18']
    };
    const CAT = {
      hats: [
        { id: 'none', name: 'NO HAT', price: 0, map: NONE },
        { id: 'party', name: 'PARTY', price: 0, map: ['...ww...', '...gg...', '...tt...', '..gggg..', '..tttt..', '.gggggg.'] },
        { id: 'bow', name: 'BOW', price: 80, map: ['........', '.pp..pp.', '.ppPPpp.', '.ppPPpp.', '.pp..pp.', '........'] },
        { id: 'cap', name: 'CAP', price: 100, map: ['........', '...TT...', '..tttt..', '.tttttt.', '.TTTTTTT', '........'] },
        { id: 'beanie', name: 'BEANIE', price: 120, map: ['...ww...', '...ww...', '..rrrr..', '.rRrRrR.', '.rrrrrr.', '.RRRRRR.'] },
        { id: 'crown', name: 'CROWN', price: 300, map: ['........', '.g.gg.g.', '.g.gg.g.', '.gggggg.', '.gpggpg.', '.GGGGGG.'] }
      ],
      skins: [
        { id: 'classic', name: 'CLASSIC', price: 0 }, { id: 'roast', name: 'DARK ROAST', price: 60 },
        { id: 'caramel', name: 'CARAMEL', price: 90 }, { id: 'strawberry', name: 'STRAWBERRY', price: 150 },
        { id: 'mint', name: 'MINT', price: 150 }, { id: 'gold', name: '24K GOLD', price: 250 }
      ],
      face: [
        { id: 'none', name: 'NOTHING', price: 0, map: NONE },
        { id: 'blush', name: 'BLUSH', price: 40, map: ['........', '.pp.pp..', 'ppppppp.', '.ppppp..', '..ppp...', '...p....'] },
        { id: 'stache', name: 'STACHE', price: 70, map: ['........', '........', '.kkkkkk.', 'kkk..kkk', 'k......k', '........'] },
        { id: 'monocle', name: 'MONOCLE', price: 90, map: ['..gggg..', '.g....g.', '.g....g.', '.g....g.', '..gggg..', '......gg'] },
        { id: 'nerd', name: 'NERD', price: 110, map: ['........', 'kkk..kkk', 'kwkkkkwk', 'kkk..kkk', '........', '........'] },
        { id: 'shades', name: 'SHADES', price: 120, map: ['........', 'kkkkkkkk', 'kck..kck', 'kkk..kkk', '.k....k.', '........'] }
      ]
    };

    const st = this.state || {};
    const cat = st.cat || 'hats';
    const pts = st.pts === undefined ? 425 : st.pts;
    const owned = st.owned || { 'hats:none': true, 'hats:party': true, 'skins:classic': true, 'face:none': true };
    const worn = st.worn || { hats: 'party', skins: 'classic', face: 'none' };
    const prev = st.prev || {};
    const look = Object.assign({}, worn, prev);
    const focusId = prev[cat] || worn[cat];
    const focus = CAT[cat].find((i) => i.id === focusId) || CAT[cat][0];
    const key = cat + ':' + focus.id;
    const has = !!owned[key];

    const cells = (item) => {
      const map = item.map || POOP;
      const pal = item.map ? PAL : Object.assign({}, PAL, { b: SKIN[item.id][0], l: SKIN[item.id][1], d: SKIN[item.id][2] });
      return map.join('').split('').map((ch) => ({ s: ch === '.' ? 'background: transparent;' : 'background: ' + pal[ch] + ';' }));
    };

    const items = CAT[cat].map((it) => {
      const k = cat + ':' + it.id, own = !!owned[k], on = worn[cat] === it.id, sel = it.id === focus.id;
      let tag, tagStyle;
      if (on) { tag = 'WEARING'; tagStyle = 'color: #1F5C54;'; }
      else if (own) { tag = it.price ? 'OWNED' : 'FREE'; tagStyle = 'color: #6E5542;'; }
      else { tag = it.price + ' PTS'; tagStyle = pts >= it.price ? 'color: #2B1A10;' : 'color: #A63F2A;'; }
      return {
        name: it.name, tag: tag, tagStyle: tagStyle, cells: cells(it),
        label: it.name + ', ' + tag.toLowerCase(),
        card: sel ? 'background: #E0A32E; box-shadow: 4px 4px 0 #2B1A10;' : 'background: #FFF8EC;',
        pick: () => {
          const p = Object.assign({}, prev); p[cat] = it.id;
          const lines = own ? ['classic.', 'oh this old thing?', 'yes. this.'] : ['ooh. try before you buy', 'do i look rich', 'put it on my tab'];
          this.setState({ prev: p, mood: 0, bub: lines[Math.floor(Math.random() * lines.length)] });
        }
      };
    });

    let actLabel, actStyle;
    if (has && worn[cat] === focus.id) { actLabel = 'WEARING IT'; actStyle = 'background: #D9CDBB; color: #6E5542; box-shadow: none;'; }
    else if (has) { actLabel = 'WEAR IT'; actStyle = 'background: #7A4A21; color: #FFF8EC; box-shadow: 5px 5px 0 #2B1A10;'; }
    else if (pts >= focus.price) { actLabel = 'BUY FOR ' + focus.price; actStyle = 'background: #E0A32E; color: #2B1A10; box-shadow: 5px 5px 0 #2B1A10;'; }
    else { actLabel = 'NEED ' + (focus.price - pts) + ' MORE'; actStyle = 'background: #D9CDBB; color: #6E5542; box-shadow: none;'; }

    const act = () => {
      if (has && worn[cat] === focus.id) return;
      if (has) {
        const w = Object.assign({}, worn); w[cat] = focus.id;
        const p = Object.assign({}, prev); delete p[cat];
        this.setState({ worn: w, prev: p, mood: 4, bub: "lookin' regular" });
      } else if (pts >= focus.price) {
        const o = Object.assign({}, owned); o[key] = true;
        const w = Object.assign({}, worn); w[cat] = focus.id;
        const p = Object.assign({}, prev); delete p[cat];
        const lines = ['FANCY!!', 'i feel expensive', 'worth every poop'];
        this.setState({ pts: pts - focus.price, owned: o, worn: w, prev: p, mood: 4, bub: lines[Math.floor(Math.random() * lines.length)] });
      } else {
        this.setState({ mood: 2, bub: "we're broke :(" });
      }
    };

    const tab = (c) => () => this.setState({ cat: c, prev: {}, mood: 0, bub: '' });
    const tabStyle = (c) => c === cat ? 'background: #7A4A21; color: #FFF8EC; box-shadow: 4px 4px 0 #2B1A10;' : 'background: #FFF8EC; color: #6E5542;';

    return {
      pts: String(pts), ptsLabel: pts + ' points',
      phat: look.hats, pskin: look.skins, pface: look.face,
      pmood: st.mood || 0, bub: st.bub || 'dress me up',
      items: items, act: act, actLabel: actLabel, actStyle: actStyle,
      tabHats: tab('hats'), tabSkins: tab('skins'), tabFace: tab('face'),
      tabHatsStyle: tabStyle('hats'), tabSkinsStyle: tabStyle('skins'), tabFaceStyle: tabStyle('face'),
      tabHatsOn: String(cat === 'hats'), tabSkinsOn: String(cat === 'skins'), tabFaceOn: String(cat === 'face')
    };
  }
}
</script>
</body>
</html>

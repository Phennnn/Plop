      <span style="text-align: center; font-family: 'Press Start 2P', monospace; font-size: 8px; color: #6E5542">F</span>

      <span style="display: block; font-family: 'Press Start 2P', monospace; font-size: 20px; line-height: 1.3">17</span>
      <span style="font-size: 13px; color: #6E5542">THIS MONTH</span>
    </div>
    <div style="background: #FFF8EC; border: 3px solid #2B1A10; box-shadow: 4px 4px 0 #2B1A10; padding: 12px 13px 10px">

  <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px">
    <li style="display: flex; align-items: center; gap: 11px; background: #FFF8EC; border: 3px solid #2B1A10; padding: 9px 11px">
      <span style="width: 30px; height: 30px; flex: none; background: #2E6F3C; border: 3px solid #2B1A10; color: #FFF8EC; display: grid; place-items: center; font-family: 'Press Start 2P', monospace; font-size: 11px">4</span>
      <span style="font-family: 'Press Start 2P', monospace; font-size: 10px">19:42</span>
      <span style="flex: 1; min-width: 0; font-size: 14px; color: #6E5542; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">dried mango incident</span>
    </li>
    <li style="display: flex; align-items: center; gap: 11px; background: #FFF8EC; border: 3px solid #2B1A10; padding: 9px 11px">
      <span style="width: 30px; height: 30px; flex: none; background: #4F6A24; border: 3px solid #2B1A10; color: #FFF8EC; display: grid; place-items: center; font-family: 'Press Start 2P', monospace; font-size: 11px">3</span>

  <nav style="margin-top: auto; display: flex; border-top: 3px solid #2B1A10; margin-left: -20px; margin-right: -20px; background: #FFF8EC">
    <a href="Today.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; min-height: 54px; padding: 12px 0 26px; text-decoration: none; color: #6E5542; font-family: 'Press Start 2P', monospace; font-size: 8px">
      <svg width="18" height="18" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true" fill="currentColor"><rect x="0" y="1" width="8" height="1"></rect><rect x="0" y="7" width="8" height="1"></rect><rect x="0" y="2" width="1" height="5"></rect><rect x="7" y="2" width="1" height="5"></rect><rect x="3" y="4" width="2" height="2"></rect></svg>

    <a href="Insights.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; min-height: 54px; padding: 12px 0 26px; text-decoration: none; color: #6E5542; font-family: 'Press Start 2P', monospace; font-size: 8px">

      <svg width="18" height="18" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true" fill="currentColor"><rect x="0" y="0" width="2" height="2"></rect><rect x="3" y="0" width="2" height="2"></rect><rect x="6" y="0" width="2" height="2"></rect><rect x="0" y="3" width="2" height="2"></rect><rect x="3" y="3" width="2" height="2"></rect><rect x="6" y="3" width="2" height="2"></rect><rect x="0" y="6" width="2" height="2"></rect><rect x="3" y="6" width="2" height="2"></rect></svg>
      HISTORY
    </a>
    <a href="Closet.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; min-height: 54px; padding: 12px 0 26px; text-decoration: none; border-left: 3px solid #2B1A10; color: #6E5542; font-family: 'Press Start 2P', monospace; font-size: 8px">
      <svg width="18" height="18" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true" fill="currentColor"><rect x="2" y="0" width="4" height="5"></rect><rect x="0" y="5" width="8" height="2"></rect></svg>
      CLOSET
    </a>
  </nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // October 2026 opens on a Thursday; 14 Oct is today, nothing logged yet.
    const COUNTS = { 1:1, 2:2, 3:1, 4:1, 5:1, 6:2, 7:1, 8:1, 9:2, 10:1, 11:1, 12:1, 13:2, 14:0 };
    const TODAY = 14;
    const days = [];
    for (let n = 1; n <= 31; n++) {
      const c = COUNTS[n];
      let style;
      if (n === TODAY) {
        style = 'background: #E0A32E; color: #2B1A10;';
      } else if (c === undefined) {
        style = 'background: #EFE3D2; color: #B9A58C;';
      } else if (c === 1) {
        style = 'background: #C79A6A; color: #2B1A10;';
      } else {
        style = 'background: #7A4A21; color: #FFF8EC;';
      }
      days.push({ n: n, style: style });
    }
    return { days: days };
  }
}
</script>
</body>
